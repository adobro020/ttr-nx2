# gitleaks configuration: the default rules plus the TTR play cookie
# (CLAUDE.md rule 4). tools/guardrails/check.py applies the same pattern
# without gitleaks, so either one alone rejects a cookie.
title = "ttr-nx2"

[extend]
useDefault = true

[[rules]]
id = "ttr-playcookie"
description = "A value assigned to TTR_PLAYCOOKIE (a TTR play cookie is a login credential)"
regex = '''TTR_PLAYCOOKIE=["']?[A-Za-z0-9+/=_.:-]{3,}|TTR_PLAYCOOKIE["']?\]?\s*[:=]\s*["'][A-Za-z0-9+/=_.:-]{3,}["']'''
keywords = ["ttr_playcookie"]

  [[rules.allowlists]]
  description = "Phase 0 brief quotes the dummy value used to test this rule"
  paths = ['''^prompts/phase-00-workspace-and-repo\.md$''']
