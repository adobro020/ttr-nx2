# SPDX-License-Identifier: GPL-2.0-only
#
# CI for TTR NX2. Branch protection on main requires every job here.
# Third-party actions are pinned by commit; tools are checked by SHA-256.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  checks:
    name: guardrails, lint, unit tests, doctor
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0          # the history scan needs every commit
          submodules: recursive   # the launcher tree is compared to its pin
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install gitleaks
        run: |
          set -eu
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tgz}"
          echo "${GITLEAKS_SHA256}  ${tgz}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$tgz" -C "$RUNNER_TEMP/bin" gitleaks
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # Rules 1, 3, 4: no game files, launcher byte-identical, no secrets.
      - name: Guard rails (tree at HEAD)
        run: python3 tools/guardrails/check.py --all
      - name: Guard rails (every commit in history)
        run: python3 tools/guardrails/check.py --history HEAD
      - name: Secret scan (gitleaks, full history)
        run: gitleaks git --redact --no-banner --config .gitleaks.toml .

      - name: Lint
        run: make lint
      - name: Unit tests
        run: make test
      - name: Doctor (CI variant)
        run: make doctor CI=1

  hello-nro:
    name: build hello.nro (devkit container)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        run: make hello
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hello-nro
          path: build/hello.nro
          if-no-files-found: error
